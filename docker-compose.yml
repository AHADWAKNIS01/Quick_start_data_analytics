services:
  couchbase:
    image: couchbase/server:community-7.6.0
    container_name: quickcart-couchbase
    ports: ["8091-8096:8091-8096", "11210:11210"]
    volumes: ["quickcart-couchbase:/opt/couchbase/var"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/ui/index.html"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      COUCHBASE_CONNSTR: couchbase://couchbase
      COUCHBASE_USER: Administrator
      COUCHBASE_PASSWORD: password
      COUCHBASE_BUCKET: quickcart
    ports: ["8000:8000"]
    depends_on:
      couchbase:
        condition: service_healthy
volumes:
  quickcart-couchbase:
